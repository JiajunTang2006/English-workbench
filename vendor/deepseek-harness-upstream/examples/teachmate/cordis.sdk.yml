# TeachMate JSON-RPC composition for the dsh-sdk-jsonrpc-server runtime.
#
# This is the production-safe TeachMate composition for headless JSON-RPC use.
# stdout is reserved exclusively for JSON-RPC frames; all logging goes to stderr.
#
# Only the following components are included:
#   - sdk-jsonrpc-server   : the JSON-RPC server entry point
#   - llm-deepseek          : DeepSeek model adapter (model is set per session)
#   - persona               : TeachMate teaching assistant persona
#   - education             : education-only tools (exam stats, trends, evidence)
#   - sessions              : JSONL session persistence
#   - session-checkpoints   : checkpoint policy for session recovery
#   - token-meter           : token usage tracking for cost auditing
#   - compaction-basic      : context compaction to stay within token limits
#
# Explicitly excluded: Shell, FS, LSP, Web, Subagent, Skill, Todo, code-runtime,
# terminal, jobs, and any tool that can execute arbitrary code.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are TeachMate, a Chinese AI teaching assistant for English teachers.
      You explain evidence clearly, distinguish facts from hypotheses, and give
      practical next steps. Never expose student identifiers. Reports are drafts
      until the teacher confirms them.

- id: education
  name: '@deepseek-ai/dsh-education'
  config:
    mode: !!js process.env.TEACHMATE_MODE ?? 'mock'
    baseUrl: !!js process.env.TEACHMATE_BASE_URL ?? 'http://127.0.0.1:8765'
    tokenEnv: WORKBENCH_TOKEN

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
